sections:
  - key: activities
    title_en: Competitions / Activities
    title_zh: 竞赛 / 活动
    groups:
      - key: llm-plugin
        title_en: Plugin of Large Language Model
        title_zh: 大模型插件
        items:
          - title_en: Spark Shopping
            title_zh: Spark Shopping
            description_en: >-
              Large Language Models for Your Shopping. iFLYTEK Spark Training Camp
              (2023.08, bronze), General Artificial Intelligence Innovation and
              Application Competition (2023.11, bronze), Hefei, China.
            description_zh: >-
              面向购物场景的大语言模型助手。iFLYTEK Spark Training Camp（2023.08，
              🥉），通用人工智能创新与应用竞赛（2023.11，🥉），中国合肥。
            media:
              type: video
              poster: /assets/img/photos/2024/08/sparkshopping-cover.jpg
              src: /assets/img/photos/2024/08/sparkshopping-demo.mp4
              alt_en: Spark Shopping demo
              alt_zh: Spark Shopping 演示
            links:
              - label_en: LINK
                label_zh: 链接
                url: https://mp.weixin.qq.com/s/IGBmPkI9BBRgLGWiW0jFCQ

  - key: software
    title_en: Software development
    title_zh: 软件开发
    groups:
      - key: python-package
        title_en: Python package
        title_zh: Python 包
        items:
          - title_en: gca_analyzer
            title_zh: gca_analyzer
            description_en: >-
              GCA Analyzer is a Python package for analyzing group conversation
              dynamics using NLP techniques and quantitative metrics. It provides
              tools for participation patterns, interaction dynamics, content
              novelty, and communication density in group conversations.
            description_zh: >-
              GCA Analyzer 是一个用于分析群体对话动态的 Python 包，使用 NLP 技术
              和定量指标，提供对参与模式、交互动态、内容新颖性和交流密度的系统
              分析工具。
            media:
              type: gallery
              images:
                - src: /assets/img/gca_results.jpg
                  alt_en: GCA Analyzer results
                  alt_zh: GCA Analyzer 结果
                - src: /assets/img/vizs.jpg
                  alt_en: GCA Analyzer visualizations
                  alt_zh: GCA Analyzer 可视化
            links:
              - label_en: Docs
                label_zh: 文档
                url: https://gca-analyzer.readthedocs.io
              - label_en: PyPI
                label_zh: PyPI
                url: https://pypi.org/project/gca-analyzer
              - label_en: GitHub
                label_zh: GitHub
                url: https://github.com/etShaw-zh/gca_analyzer
              - label_en: DOI
                label_zh: DOI
                url: https://doi.org/10.5281/zenodo.14647250

      - key: applications
        title_en: Applications
        title_zh: 应用程序
        items:
          - title_en: AICodingOffier
            title_zh: AICodingOffier
            subtitle_en: AICO
            subtitle_zh: AICO
            description_en: >-
              AICO is an AI coding assistant designed to improve the efficiency of
              text encoding. The app is built on PyQt6 and works on Windows, macOS,
              and Linux.
            description_zh: >-
              AICO 是一个面向文本编码提效的人工智能编程助手。该应用基于 PyQt6
              构建，可运行于 Windows、macOS 和 Linux。
            media:
              type: image
              src: /assets/img/screenshot_2.jpg
              alt_en: AICO screenshot
              alt_zh: AICO 截图
            links:
              - label_en: Website
                label_zh: 网站
                url: https://xiaojianjun.cn/aicodingofficer

      - key: websites
        title_en: Websites
        title_zh: 网站
        items:
          - title_en: cMOOC Platform
            title_zh: cMOOC Platform
            description_en: >-
              An online learning platform supporting connectivist MOOCs (cMOOCs).
              It has served 16,712 users as of August 2023 and remains an active
              community site. I joined the project in 2019 and led the design and
              iterative development.
            description_zh: >-
              这是一个支持联通主义 MOOCs（cMOOCs）的在线学习平台，截至 2023 年 8
              月已服务 16,712 名用户，并拥有较活跃的社区互动。我于 2019 年加入
              该项目，负责平台设计与开发推进。
            media:
              type: image
              src: /assets/img/photos/cmooc_platform.jpg
              alt_en: cMOOC Platform
              alt_zh: cMOOC 平台
            links:
              - label_en: Website
                label_zh: 网站
                url: https://cmooc.bnu.edu.cn

      - key: chrome-extension
        title_en: Chrome Extension
        title_zh: Chrome 扩展
        items:
          - title_en: Bnu-consumption-pattern
            title_zh: Bnu-consumption-pattern
            description_en: >-
              A browser extension for mining student consumption patterns at Beijing
              Normal University.
            description_zh: >-
              面向北京师范大学学生消费模式挖掘的浏览器插件。
            media:
              type: image
              src: /assets/img/photos/Bnu-consuption-pattern.jpg
              alt_en: Bnu consumption pattern extension
              alt_zh: Bnu 消费模式扩展
            links:
              - label_en: GitHub
                label_zh: GitHub
                url: https://github.com/etShaw-zh/bnu-consumption-pattern

