        cap_en: "Fig. 5 · Marginal Effects"
        cap_zh: "Fig. 5 · 边际效应"
        zoom_caption_en: "ILE (2026) · Figure 5 — Marginal effects plot for the interaction effect of CIE levels and reciprocity on subsequent interactions"
        zoom_caption_zh: "ILE (2026) · Figure 5 — 认知投入层级（CIE）与互惠性对后续交互影响的边际效应图（含局部放大）"
