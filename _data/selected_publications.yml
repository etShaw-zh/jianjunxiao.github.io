        zoom_caption_en: "LAK26 · Table 5 — Descriptive statistics of CPS order parameters and synergy degree across Problem Types (PT) and Collaborative Quality (CQ)"
        zoom_caption_zh: "LAK26 · Table 5 — 不同问题类型（PT）与协作质量等级（CQ）下的序参量与协同度描述统计"
