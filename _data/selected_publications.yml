        cap_zh: "Fig. 3 · 超图选帖"
        zoom_caption_en: "arXiv (2026) · Figure 3 — Example of hypergraph-based target selection for PCA discussion participation"
        zoom_caption_zh: "arXiv (2026) · Figure 3 — 基于超图结构识别智能体介入焦点帖子的选帖示例"
      - kind: fig
