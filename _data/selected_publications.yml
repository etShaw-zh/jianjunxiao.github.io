        img: "/assets/img/photos/2026/figures/ile26-fig2-design.jpg"
        alt_en: "Figure 2 Diagram of the research design"
        alt_zh: "Figure 2 研究设计流程图"
        cap_en: "Fig. 2 · Research Design"
        cap_zh: "Fig. 2 · 研究设计"
        zoom_caption_en: "ILE (2026) · Figure 2 — Diagram of the research design: NLP CIE classification, Relational Event Modeling, and multivariate meta-analysis"
        zoom_caption_zh: "ILE (2026) · Figure 2 — 研究设计图：NLP 自动 CIE 编码、关系事件建模（REM）与多元元分析"
      - kind: fig
        img: "/assets/img/photos/2026/figures/ile26-fig4-cie.jpg"
        alt_en: "Figure 4 Percentage of posts by CIE level"
        alt_zh: "Figure 4 CIE 认知投入占比分布"
