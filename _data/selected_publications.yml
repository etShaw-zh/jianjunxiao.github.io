      cap_zh: "Fig. 1 · 研究流程"
      zoom_caption_en: "LAK26 · Figure 1 — The research design and procedure: data collection, automated CPS classification, Synergy Degree Modeling, and comparative analysis"
      zoom_caption_zh: "LAK26 · Figure 1 — 研究设计与建模流程：数据采集、CPS 行为自动分类、协同度建模与比较分析"
