  - id: lak26-synergy-2026
    num: "01"
    zoom_group: lak26
    venue_en: "LAK26 · Bergen, Norway · 2026"
    venue_zh: "LAK26 · 挪威卑尔根 · 2026"
    tag_en: "Full Research Paper"
    tag_zh: "Full Research Paper"
    title_en: "Modeling collaborative problem solving dynamics from group discourse: A text-mining approach with synergy degree model"
    title_zh: "基于群体话语的协作问题解决动态过程建模：一种融合协同度模型的文本挖掘方法"
    authors_html: "<strong>Xiao, J.</strong>, Wang, C., &amp; Zhang, W."
    contribution_en: "Combines automated discussion coding with a synergy model to track collaborative problem solving, validated through permutation tests and analysis of group differences."
    contribution_zh: "结合自动话语编码与协同度模型，追踪协作问题解决过程，并通过置换检验与组间差异分析进行验证。"
    links:
      - label: "PDF"
        url: "https://arxiv.org/pdf/2512.13061.pdf"
        muted: true
      - label: "DOI"
        url: "https://doi.org/10.1145/3785022.3785049"
        muted: false
