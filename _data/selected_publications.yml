        cap_zh: "Table 3 · 交互元分析"
        zoom_caption_en: "ILE (2026) · Table 3 — Meta-analysis of parameter estimates for REMs on reciprocate with interaction effect on CIE level"
        zoom_caption_zh: "ILE (2026) · Table 3 — REM 互惠性与认知投入交互效应的跨轮次元分析参数估计"

  - id: human-genai-cmooc-2026
    num: "03"
    zoom_group: pca26
    venue_en: "arXiv Preprint · 2026"
    venue_zh: "arXiv 预印本 · 2026"
    tag_en: "Human–GenAI · DBR"
    tag_zh: "人机协同 · DBR"
    title_en: "Designing human-GenAI interaction for cMOOC discussion facilitation: Effects of a collaborative AI-in-the-loop workflow on social and cognitive presence"
    title_zh: "面向 cMOOC 讨论促进的人机交互设计：协同 AI-in-the-loop 工作流对社会与认知临场感的影响"
    authors_html: "<strong>Xiao, J.</strong>, &amp; Wang, C."
    contribution_en: "Develops <em>FaciHub</em> through two design-based research iterations, combining AI-generated replies with human review and finding gains in social presence in cMOOC discussions with 178 participants."
    contribution_zh: "通过两轮基于设计的研究构建 <em>FaciHub</em>，结合 AI 生成回复与人工审核，在 178 人参与的 cMOOC 讨论中发现社会临场感提升。"
    links:
      - label: "PDF"
        url: "https://arxiv.org/pdf/2603.29285v2.pdf"
        muted: true
      - label: "arXiv"
        url: "https://arxiv.org/abs/2603.29285v2"
        muted: false
    preview:
      kind: fig
      img: "/assets/img/photos/2026/figures/pca26-fig1-workflow.jpg"
      alt_en: "Figure 1 FaciHub workflow architecture"
      alt_zh: "Figure 1 FaciHub 工作流架构"
      cap_en: "Fig. 1 · FaciHub Flow"
      cap_zh: "Fig. 1 · FaciHub 流程"
      zoom_caption_en: "arXiv (2026) · Figure 1 — Workflow structure for PCA target selection, multi-role response generation, and human review in FaciHub"
      zoom_caption_zh: "arXiv (2026) · Figure 1 — FaciHub 超图选帖、多角色大模型生成与教师审核工作流架构"
    gallery_aria_en: "Figures and tables extracted from Human-GenAI cMOOC PDF"
    gallery_aria_zh: "人机协同 cMOOC 论文 PDF 图表"
    figures:
      - kind: fig
        img: "/assets/img/photos/2026/figures/pca26-fig2-interface.jpg"
        alt_en: "Figure 2 FaciHub human review interface"
        alt_zh: "Figure 2 FaciHub 人工审核界面"
        cap_en: "Fig. 2 · FaciHub UI"
        cap_zh: "Fig. 2 · FaciHub 界面"
        zoom_caption_en: "arXiv (2026) · Figure 2 — FaciHub interface for contextual inspection and human approval of PCA-generated replies"
        zoom_caption_zh: "arXiv (2026) · Figure 2 — FaciHub 语境检视与教师人工审核智能体回复的系统界面"
      - kind: fig
        img: "/assets/img/photos/2026/figures/pca26-fig3-hypergraph.jpg"
