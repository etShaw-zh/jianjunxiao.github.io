        cap_zh: "Fig. 4 · CIE 分布"
        zoom_caption_en: "ILE (2026) · Figure 4 — Percentage of discussion posts by CIE cognitive engagement level across 8 cMOOC iterations"
        zoom_caption_zh: "ILE (2026) · Figure 4 — 8 轮 cMOOC 课程中不同认知投入层级（CIE）发帖占比分布"
