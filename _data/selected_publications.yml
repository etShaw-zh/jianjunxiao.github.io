        zoom_caption_zh: "LAK26 · Table 6 — 问题类型与协作质量组间显著差异检验（Kruskal-Wallis 与 Fisher ANOVA）"

  - id: network-dynamics-cie-2026
    num: "02"
    zoom_group: ile26
    venue_en: "Interactive Learning Environments · 2026"
    venue_zh: "Interactive Learning Environments · 2026"
    tag_en: "SSCI Q1 · Solo"
    tag_zh: "SSCI Q1 · 独立作者"
    title_en: "Exploring interaction patterns in open learning environments: integrating network dynamics and cognitive engagement"
    title_zh: "开放学习环境中的交互模式探索：融合网络动态与认知投入"
    authors_html: "<strong>Xiao, J.<sup>&dagger;</sup></strong>"
    contribution_en: "Models 39,000+ interactions among 1,939 learners across eight cMOOC iterations to reveal how reciprocity and cognitive engagement interact in online discussion."
    contribution_zh: "对 8 轮 cMOOC 中 1,939 名学习者的 39,000+ 条交互事件建模，揭示在线讨论中互惠机制与认知投入的交互效应。"
    links:
      - label: "DOI"
        url: "https://doi.org/10.1080/10494820.2026.2632766"
        muted: false
    preview:
      kind: fig
      img: "/assets/img/photos/2026/figures/ile26-fig1-framework.jpg"
      alt_en: "Figure 1 Theoretical framework of REMs and CIE"
      alt_zh: "Figure 1 理论分析框架图"
      cap_en: "Fig. 1 · REM Framework"
      cap_zh: "Fig. 1 · 理论框架"
      zoom_caption_en: "ILE (2026) · Figure 1 — REMs analysis of reciprocity and interaction levels in cMOOCs (Theoretical Framework)"
      zoom_caption_zh: "ILE (2026) · Figure 1 — 理论分析框架：融合网络动态（互惠性）与 CIE 联通主义认知投入的关系事件建模"
    gallery_aria_en: "Figures and tables extracted from Interactive Learning Environments 2026 PDF"
    gallery_aria_zh: "ILE 2026 论文 PDF 图表"
    figures:
